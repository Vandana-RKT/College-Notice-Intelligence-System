<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNIS | Login</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="login-page"><div class="login-card"><div class="login-logo">C</div><p class="eyebrow">COLLEGE NOTICE INTELLIGENCE SYSTEM</p><h1>Welcome back</h1><p class="muted">Sign in to access your workspace.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Email address</label><input type="email" name="email" placeholder="you@college.edu" required autocomplete="username"><label>Password</label><input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"><button class="btn primary full" type="submit">Sign in</button></form><p class="login-foot">Authorized college users only</p></div></body></html>
